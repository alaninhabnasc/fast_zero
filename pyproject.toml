[project]
name = "fast-zero"
version = "0.1.0"
description = ""
authors = [
    {name = "Alaninhabnasc",email = "abeatriz.nasc05@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.164.0,<0.165.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "typos (>=1.52.2,<2.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)",
    "poethepoet (>=0.49.0,<0.50.0)"
]
[tool.poe]
poetry_command = ""

[tool.poe.tasks]
lint.sequence = [
    { cmd = "typos" },
    { cmd = "ruff check" },
]
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
serve = "fastapi dev fast_zero/app.py"
test.sequence = [
  "lint",
  { cmd = "coverage run -m pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]